#
# Supported values: True, False

# d3d11.exposeDriverCommandLists = True


# Reproducible Command Stream
#
# Ensure that for the same D3D commands the output VK commands
# don't change between runs. Useful for comparative benchmarking,
# can negatively affect performance and can break some games
# that don't use queries correctly.
#
# Supported values:
# - True/False

# d3d11.reproducibleCommandStream = False
# d3d9.reproducibleCommandStream = False


# Sets number of pipeline compiler threads.
# 
# If the graphics pipeline library feature is enabled, the given
# number of threads will be used for shader compilation. Some of
# these threads will be reserved for high-priority work.
#
# Supported values:
# - 0 to use (CPULogicalThreads - 2) compiler threads
# - any positive number to enforce the thread count

# dxvk.numCompilerThreads = 0


# Toggles raw SSBO usage.
# 
# Uses storage buffers to implement raw and structured buffer
# views. Enabled by default on hardware which has a storage
# buffer offset alignment requirement of 4 Bytes (e.g. AMD).
# Enabling this may improve performance, but is not safe on
# hardware with higher alignment requirements.
# 
# Supported values:
# - Auto: Don't change the default
# - True, False: Always enable / disable

# dxvk.useRawSsbo = Auto


# Controls graphics pipeline library behaviour
#
# Can be used to change VK_EXT_graphics_pipeline_library usage for
# debugging purpose. This feature is replaced by Async, 
# which does not require any specific driver/extension support
# and provides better performance than using DXVK with GPL.
#
# Supported values:
# - Auto: Enable if supported, and compile optimized pipelines in the background
# - True: Enable if supported, but do not compile optimized pipelines
# - False: Always disable the feature

# dxvk.enableGraphicsPipelineLibrary = False


# Controls pipeline lifetime tracking
#
# If enabled, pipeline libraries will be freed aggressively in order
# save memory and address space. Has no effect if graphics pipeline
# libraries are not supported or disabled.
#
# Supported values:
# - Auto: Enable tracking for 32-bit applications only
# - True: Always enable tracking
# - False: Always disable tracking

# dxvk.trackPipelineLifetime = Auto


# Controls descriptor update templates
#
# On 32-bit wine, vkUpdateDescriptorSets has significant overhead due
# to struct conversion, so we should use descriptor update templates.
# For 64-bit applications, using templates is slower on some drivers.
# Important: It is not enabled by default in upstream DXVK, due to environments,
# where it can't be used. Such environments probably are:
# 1) VirGL / Mesa Venus (Vulkan Virtualization);
# 2) Layered API Translation (e.g., MoltenVK on macOS);
# 3) x86-to-ARM emulators - FEX-Emu/Box64 and the underlying Winlator or other similar software.
# If you are using DXVK-GPLALL in such environments,
# be sure to check performance/stability effect of disabling this option.
#
# Supported values:
# - True: Enable descriptor update templates
# - False: Disable descriptor update templates

# dxvk.enableDescriptorUpdateTemplates = True


